name: Validate

on:
  push:
  pull_request:
  schedule:
    # Catches breakage from new Home Assistant or HACS releases rather than
    # from our own changes.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  version:
    name: Tag matches manifest
    # Only meaningful on a tag push. The release workflow stamps the tag
    # version into the published asset, so this is a backstop for the repo
    # file itself, which is what manual installers get.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          tag="${tag#v}"
          manifest=$(jq -r .version custom_components/alarm_center/manifest.json)
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::manifest.json says $manifest but the tag is $tag."
            echo "::error::Bump manifest.json and re-tag, or let the release workflow build the asset."
            exit 1
          fi

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile check
        run: python -m compileall -q custom_components/alarm_center

  frontend:
    name: Frontend syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check
        run: |
          node --check custom_components/alarm_center/frontend/panel.js
          node --check custom_components/alarm_center/frontend/alarm-center-card.js

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
